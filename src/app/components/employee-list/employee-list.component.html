<div class="employee-list-container">
  <h2>Employee Management System</h2>
  
  <kendo-grid
    [data]="employees"
    [pageable]="true"
    [pageSize]="10"
    [sortable]="true"
    [resizable]="true"
    [height]="600"
  >
    <kendo-grid-column
      field="userName"
      title="User Name"
      [width]="150"
    ></kendo-grid-column>

    <kendo-grid-column
      field="email"
      title="Email"
      [width]="200"
    ></kendo-grid-column>

    <kendo-grid-column
      field="joiningDate"
      title="Joining Date"
      [width]="130"
      format="{0:dd/MM/yyyy}"
    ></kendo-grid-column>

    <kendo-grid-column
      field="mobile"
      title="Mobile"
      [width]="140"
    ></kendo-grid-column>

    <kendo-grid-column
      field="gender"
      title="Gender"
      [width]="100"
    ></kendo-grid-column>

    <kendo-grid-column
      field="languagesKnown"
      title="Languages Known"
      [width]="200"
    >
      <ng-template kendoGridCellTemplate let-dataItem>
        {{ formatLanguages(dataItem.languagesKnown) }}
      </ng-template>
    </kendo-grid-column>

    <kendo-grid-column
      title="Actions"
      [width]="120"
    >
      <ng-template kendoGridCellTemplate let-dataItem>
        <button
          kendoButton
          [primary]="true"
          (click)="onEditClick(dataItem)"
        >
          Edit
        </button>
      </ng-template>
    </kendo-grid-column>
  </kendo-grid>
</div>
